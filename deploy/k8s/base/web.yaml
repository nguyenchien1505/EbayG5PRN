# Two web replicas behind nginx (F02 shape). Configuration mirrors compose.app.yaml; per-cluster values come from ConfigMap
# ebaygroup5-config and passwords from Secret ebaygroup5-secrets (both created by scripts/Deploy-K8s.ps1).
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  # Headless: DNS returns every ready pod, so nginx round-robins across replicas exactly as with Docker DNS.
  clusterIP: None
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web
      containers:
        - name: web
          image: ebaygroup5-web:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          # Keep serving while nginx's DNS view (valid=5s) and the endpoints drop this pod, then Kestrel shuts down gracefully.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Disputes__DemoBusinessDaySeconds
              valueFrom:
                configMapKeyRef:
                  name: ebaygroup5-config
                  key: demo-business-day-seconds
            - name: SQL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ebaygroup5-secrets
                  key: app-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ebaygroup5-secrets
                  key: redis-password
            - name: ConnectionStrings__DefaultConnection
              value: "Server=sqlserver,1433;Database=EbayGroup5;User ID=EbayGroup5App;Password=$(SQL_APP_PASSWORD);Encrypt=True;TrustServerCertificate=True"
            - name: ConnectionStrings__Redis
              value: "redis:6379,password=$(REDIS_PASSWORD),abortConnect=false"
            - name: DataProtection__KeyStore
              value: Redis
            - name: Logging__Console__FormatterName
              value: json
            # Forwarded headers only from pod addresses (nginx); NetworkPolicy lets only nginx reach web.
            - name: ReverseProxy__KnownNetworks__0
              valueFrom:
                configMapKeyRef:
                  name: ebaygroup5-config
                  key: pod-cidr
            - name: Chat__AllowedOrigins__0
              valueFrom:
                configMapKeyRef:
                  name: ebaygroup5-config
                  key: origin-localhost
            - name: Chat__AllowedOrigins__1
              valueFrom:
                configMapKeyRef:
                  name: ebaygroup5-config
                  key: origin-loopback
            - name: Security__AdminAllowedAddresses__0
              valueFrom:
                configMapKeyRef:
                  name: ebaygroup5-config
                  key: admin-address
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            # CPU requests only reserve scheduling room (no CPU limits): sized so the whole app fits a 2-vCPU kind node (CI runner).
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # AllowedHosts filters by Host: probes send localhost like the compose health check.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: tmp
          emptyDir: {}
