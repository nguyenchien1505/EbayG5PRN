# F06 (docs/architecture/K8S.md): local Kubernetes (kind). Render with
#   kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/k8s/base
# (the nginx template is shared with compose in deploy/nginx). Secrets and the per-cluster ConfigMap come from scripts/Deploy-K8s.ps1;
# images use the tag "local", replaced by the commit tag when the script renders.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ebaygroup5
labels:
  - pairs:
      app.kubernetes.io/part-of: ebaygroup5
resources:
  - namespace.yaml
  - sqlserver.yaml
  - redis.yaml
  - web.yaml
  - nginx.yaml
  - network-policy.yaml
configMapGenerator:
  - name: nginx-templates
    files:
      - default.conf.template=../../nginx/templates/default.conf.template
