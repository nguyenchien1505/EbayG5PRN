# TLS termination and load balancing (F01 template shared with compose). NodePorts 30443/30080 are mapped to the host by kind.
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  type: NodePort
  # Keep the client address (admin network, auth rate limits per real client).
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: nginx
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      nodePort: 30443
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
          env:
            - name: PUBLIC_HTTPS_PORT
              valueFrom:
                configMapKeyRef:
                  name: ebaygroup5-config
                  key: public-https-port
            - name: NGINX_RESOLVER
              value: kube-dns.kube-system.svc.cluster.local
            - name: WEB_UPSTREAM
              value: web.ebaygroup5.svc.cluster.local:8080
          ports:
            - name: https
              containerPort: 8443
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: templates
              mountPath: /etc/nginx/templates
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 8443
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8443
            periodSeconds: 15
      volumes:
        - name: templates
          configMap:
            name: nginx-templates
        - name: tls
          secret:
            secretName: ebaygroup5-tls
