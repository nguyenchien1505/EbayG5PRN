name: CD local
run-name: ${{ inputs.runner_label }}

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Unique label printed by Start-CdRunner.ps1
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cd-local-ebaygroup5
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Require successful CI on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
        run: |
          if ($env:RUNNER_LABEL -notmatch '^ebaygroup5-cd-[0-9a-f]{12}$') { throw 'Invalid ephemeral runner label.' }
          $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$env:GITHUB_SHA&status=completed&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not @($runs.workflow_runs | Where-Object { $_.head_sha -eq $env:GITHUB_SHA -and $_.conclusion -eq 'success' }).Count) {
            throw 'This exact commit needs a successful CI run before deployment.'
          }
      - name: Build and export immutable images
        run: ./scripts/Build-CdBundle.ps1 -ExpectedSha $env:GITHUB_SHA -OutputDirectory artifacts/cd-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cd-images-${{ github.sha }}
          path: artifacts/cd-bundle/
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cd-images-${{ github.sha }}
          path: artifacts/cd-bundle
      - name: Deploy CI images and read-only smoke on kind
        run: ./scripts/Invoke-CdDeployment.ps1 -ArtifactDirectory artifacts/cd-bundle -ExpectedSha $env:GITHUB_SHA
      - name: Deployment evidence (no credentials or state)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cd-deployment-${{ github.sha }}
          path: artifacts/cd/${{ github.sha }}/deployment-report.json
          retention-days: 7
