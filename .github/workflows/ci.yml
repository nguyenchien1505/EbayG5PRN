name: CI

on:
  push:
    branches: [main, 'task/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          # F04: the secret scan reads every commit, not just the checked-out one.
          fetch-depth: 0
      - uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.1
        with:
          global-json-file: global.json
      - name: Verify, build and test with isolated SQL
        run: ./scripts/Test-CI.ps1
      - name: App image + Nginx HTTPS/WSS stack smoke
        run: ./scripts/Test-AppStack.ps1
      # F05 (docs/architecture/LOAD.md): short JMeter + realtime run on its own isolated stack; the full run is local.
      - name: Cache Apache JMeter 5.6.3 (checksum-verified)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: artifacts/tools/apache-jmeter-5.6.3
          key: jmeter-5.6.3-387fadca903ee0aa
      - name: Load test (short profile)
        run: ./scripts/Test-AppStack.ps1 -Load Short
      - name: Load report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: load-report
          path: |
            artifacts/load/*/report.json
            artifacts/load/*/chat-*.json
            artifacts/load/*/seed-deadlocks.txt
          if-no-files-found: ignore
          retention-days: 14
      # F06 (docs/architecture/K8S.md): isolated kind cluster (pinned kind + node image), journeys, volumes, probes, NetworkPolicy.
      - name: Kubernetes (kind) deployment test
        run: ./scripts/Test-K8s.ps1
      - name: Kubernetes logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k8s-logs
          path: artifacts/k8s/*/logs.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Stack smoke logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stack-smoke-logs
          path: artifacts/stack/*/logs.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: SQL test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sql-test-results
          path: artifacts/ci/test-results/*.trx
          if-no-files-found: ignore
          retention-days: 7
